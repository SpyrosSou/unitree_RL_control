# Walking / standing policy checkpoint configuration.
# Paste the path(s) to your trained .pt files here.
# Demo scripts load from this file automatically;
# you can still override via --checkpoint / --standing_checkpoint / --walking_checkpoint on the CLI.
#
# Algorithm is inferred from the path: "logs/rsl_rl/..." → rsl_rl
#
# After retraining the walking transition policy, uncomment and fill in
# walking_transition if you want to use it instead of the base walking checkpoint.

walking:
  # Flat-terrain walking.  Trained 3149 iterations with G1-Locomotion-Flat-v0.
  checkpoint: chosen_checkpoints/walking_latest.pt

standing:
  # Zero-command standing stabilizer with arm-disturbance curriculum.
  checkpoint: chosen_checkpoints/standing_latest.pt

# ----- Transition-focused re-trains (uncomment and fill in after training) -----
# walking_transition:
#   # Task: G1-Locomotion-Flat-Transition-v0
#   # Faster command resampling (0.8-2.0 s), exposure to stop/start/reversal
#   checkpoint: logs/rsl_rl/legs/g1_locomotion_flat_transition/<YYYY-MM-DD_HH-MM-SS>/model_1500.pt

